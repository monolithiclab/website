<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- White background -->
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <!-- Subtle geometric grid pattern -->
  <g stroke="#E2E8F0" stroke-width="1" fill="none">
    <!-- Horizontal lines -->
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <!-- Vertical lines -->
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <!-- Diagonal accent lines -->
    <line x1="0" y1="0" x2="200" y2="105"/>
    <line x1="1000" y1="525" x2="1200" y2="630"/>
    <!-- Small squares at intersections -->
    <rect x="196" y="101" width="8" height="8"/>
    <rect x="396" y="206" width="8" height="8"/>
    <rect x="796" y="416" width="8" height="8"/>
    <rect x="996" y="521" width="8" height="8"/>
  </g>
  <!-- Orange accent nodes -->
  <g fill="#F97316">
    <rect x="597" y="312" width="6" height="6"/>
    <rect x="797" y="207" width="6" height="6"/>
    <rect x="397" y="417" width="6" height="6"/>
  </g>
  <!-- MONOLITHIC integrated wordmark (centered, using concept-4f) -->
  <g fill="#0F172A" transform="translate(361, 261) scale(2.4)">
    <!-- M icon (38×38) -->
    <path d="M 0 0 H 38 V 38 H 0 Z
             M 7 30 V 8 L 19 20 L 31 8 V 30
             H 27 V 13 L 19 23 L 11 13 V 30 Z"
          fill-rule="evenodd"/>
    <!-- O -->
    <path d="M 42 8 H 60 V 30 H 42 Z M 45 11 H 57 V 27 H 45 Z" fill-rule="evenodd"/>
    <!-- N -->
    <path d="M 64 8 H 67 L 79 25 V 8 H 82 V 30 H 79 L 67 13 V 30 H 64 Z"/>
    <!-- O -->
    <path d="M 86 8 H 104 V 30 H 86 Z M 89 11 H 101 V 27 H 89 Z" fill-rule="evenodd"/>
    <!-- L -->
    <path d="M 108 8 H 111 V 27 H 121 V 30 H 108 Z"/>
    <!-- I -->
    <path d="M 125 8 H 128 V 30 H 125 Z"/>
    <!-- T -->
    <path d="M 132 8 H 148 V 11 H 141.5 V 30 H 138.5 V 11 H 132 Z"/>
    <!-- H -->
    <path d="M 152 8 H 155 V 17.5 H 167 V 8 H 170 V 30 H 167 V 20.5 H 155 V 30 H 152 Z"/>
    <!-- I -->
    <path d="M 174 8 H 177 V 30 H 174 Z"/>
    <!-- C -->
    <path d="M 181 8 H 199 V 11 H 184 V 27 H 199 V 30 H 181 Z"/>
  </g>
  <!-- Tagline -->
  <g fill="#64748B">
    <text x="600" y="370" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" letter-spacing="4">CONSEIL EN TRANSFORMATION</text>
  </g>
</svg>
