<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
  <!-- Grid pattern -->
  <rect x="6" y="6" width="8" height="8" stroke="currentColor"/>
  <rect x="18" y="6" width="8" height="8" stroke="currentColor"/>
  <rect x="6" y="18" width="8" height="8" stroke="currentColor"/>
  <rect x="18" y="18" width="8" height="8" stroke="#F97316"/>
  <!-- Connection lines -->
  <line x1="14" y1="10" x2="18" y2="10" stroke="currentColor"/>
  <line x1="10" y1="14" x2="10" y2="18" stroke="currentColor"/>
  <line x1="22" y1="14" x2="22" y2="18" stroke="currentColor"/>
  <!-- Magnifying glass -->
  <circle cx="30" cy="30" r="8" stroke="currentColor"/>
  <line x1="36" y1="36" x2="42" y2="42" stroke="currentColor" stroke-width="2"/>
  <!-- Highlight inside lens -->
  <rect x="27" y="27" width="6" height="6" stroke="#F97316"/>
</svg>
