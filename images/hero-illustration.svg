<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Concept 5b: Perspective Monolith + Dense Starfield
       Same 1:4:9 perspective monolith. Richer starfield.
       Orange star with stronger glow. Cinematic. -->

  <!-- Dense starfield -->
  <circle cx="12" cy="8" r="0.6" fill="#94A3B8"/>
  <circle cx="45" cy="12" r="0.4" fill="#CBD5E1"/>
  <circle cx="78" cy="5" r="0.5" fill="#CBD5E1"/>
  <circle cx="130" cy="8" r="0.4" fill="#E2E8F0"/>
  <circle cx="160" cy="15" r="0.7" fill="#94A3B8"/>
  <circle cx="188" cy="6" r="0.5" fill="#CBD5E1"/>
  <circle cx="20" cy="40" r="0.4" fill="#E2E8F0"/>
  <circle cx="55" cy="50" r="0.5" fill="#CBD5E1"/>
  <circle cx="150" cy="45" r="0.6" fill="#CBD5E1"/>
  <circle cx="180" cy="55" r="0.4" fill="#E2E8F0"/>
  <circle cx="15" cy="80" r="0.5" fill="#CBD5E1"/>
  <circle cx="40" cy="95" r="0.3" fill="#E2E8F0"/>
  <circle cx="165" cy="90" r="0.5" fill="#CBD5E1"/>
  <circle cx="185" cy="100" r="0.4" fill="#E2E8F0"/>
  <circle cx="10" cy="130" r="0.4" fill="#E2E8F0"/>
  <circle cx="45" cy="140" r="0.5" fill="#CBD5E1"/>
  <circle cx="160" cy="135" r="0.4" fill="#E2E8F0"/>
  <circle cx="190" cy="145" r="0.6" fill="#94A3B8"/>
  <circle cx="25" cy="170" r="0.3" fill="#E2E8F0"/>
  <circle cx="55" cy="180" r="0.5" fill="#CBD5E1"/>
  <circle cx="145" cy="175" r="0.4" fill="#E2E8F0"/>
  <circle cx="175" cy="185" r="0.5" fill="#CBD5E1"/>
  <circle cx="35" cy="25" r="0.3" fill="#E2E8F0"/>
  <circle cx="170" cy="30" r="0.3" fill="#E2E8F0"/>

  <!-- Orange star — larger halo -->
  <circle cx="96" cy="18" r="8" fill="#F97316" opacity="0.08"/>
  <circle cx="96" cy="18" r="5" fill="#F97316" opacity="0.15"/>
  <circle cx="96" cy="18" r="3" fill="#F97316" opacity="0.3"/>
  <circle cx="96" cy="18" r="1.5" fill="#F97316"/>

  <!-- Ground plane -->
  <line x1="0" y1="160" x2="200" y2="160" stroke="#E2E8F0" stroke-width="0.5"/>

  <!-- Cast shadow on ground -->
  <polygon points="72,148 120,156 156,160 96,160" fill="#0F172A" opacity="0.10"/>
  <!-- Contact shadow -->
  <polygon points="72,148 120,156 130,158 82,152" fill="#0F172A" opacity="0.06"/>

  <!-- Monolith — front face -->
  <polygon points="72,48 120,40 120,156 72,148" fill="#0F172A"/>

  <!-- Monolith — right face -->
  <polygon points="120,40 132,44 132,152 120,156" fill="#334155"/>

  <!-- Monolith — top face -->
  <polygon points="72,48 120,40 132,44 84,52" fill="#1E293B"/>

  <!-- Edge highlight -->
  <line x1="120" y1="40" x2="120" y2="156" stroke="#475569" stroke-width="0.5"/>
</svg>
