name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: nothing at workflow level; each job asks for what it needs.
permissions: {}

# One Pages deployment at a time, and never cancel one mid-flight: a cancelled
# deploy can leave Pages half-published. Queued runs wait instead.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Pinned, not "latest": the generator controls the whole output, so an
      # upstream release must not silently change the published site. Bump
      # deliberately, after rebuilding locally.
      GOMDDOC_VERSION: "v0.1.4"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          # There is no go.sum here — gomddoc is fetched with `go install` from
          # a remote module. Left on, the cache step looks for one, fails to
          # find it, and warns on every run.
          cache: false
      # The module lives in the public monolithiclab/gomddoc repo, and main is
      # under cmd/ — the module root holds no package.
      - name: Install gomddoc
        run: |
          go install github.com/monolithiclab/gomddoc/cmd/gomddoc@${GOMDDOC_VERSION}
          gomddoc --version
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # The same gate a developer runs: the lint checks, then `make build`
      # (gomddoc build into public/, then prune, which fails the deploy rather
      # than publish a private file). The canonical domain comes from
      # meta.domain in .gomddoc/config.yml and the -d flag in the Makefile;
      # CNAME in the artifact tells Pages to serve it there.
      - name: Build
        run: make ci
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
