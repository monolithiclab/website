name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# The site is the repository root. It used to live in a Website/ subdirectory
# of the old combined tree, which is why this block existed at all.

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Pinned, not "latest": the generator controls the whole output, so an
      # upstream release must not silently change the published site. Bump
      # deliberately, after rebuilding locally.
      GOMDDOC_VERSION: "v0.1.2"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          # There is no go.sum here — gomddoc is fetched with `go install` from
          # a remote module. Left on, the cache step looks for one, fails to
          # find it, and warns on every run.
          cache: false
      # github.com/diffuzed/gomddoc is private, so `go install` could never
      # authenticate from CI. The module now lives in the public repo, and main
      # is under cmd/ — the module root holds no package.
      - name: Install gomddoc
        run: go install github.com/monolithiclab/gomddoc/cmd/gomddoc@${GOMDDOC_VERSION}
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      # No -d flag. It used to pass steps.pages.outputs.base_url, but gomddoc
      # rejects that outright: the value is a full URL, and the flag refuses
      # both a scheme ("should not include protocol") and a path component
      # ("should not include path"), which a project page always has. The
      # canonical domain comes from meta.domain in .gomddoc/config.yml instead,
      # and CNAME in the artifact tells Pages to serve it there — so canonicals
      # and the served domain agree.
      - name: Build
        run: gomddoc build . -o public
      # Fails the deploy rather than publishing a private file. gomddoc's
      # `exclude` does not stop markdown sources being copied — see
      # .gomddoc/config.yml.
      - name: Prune private files from the build output
        run: make prune
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
