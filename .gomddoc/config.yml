meta:
  title: "Monolithic Lab"
  description: "Monolithic Lab aide les entreprises en croissance à structurer leurs opérations, clarifier leurs décisions techniques et construire les systèmes qui soutiennent leur croissance."
  domain: "monolithiclab.fr"

language: fr

# WARNING: in gomddoc v0.1.1 — the version this repo pins in CI — `exclude` is
# NOT a confidentiality boundary.
#
# It suppresses page rendering, search, navigation and metadata, so every
# visible signal says the file is excluded. But `resolve.Build` was never given
# this list, so it still mints a clean URL for each entry, and the exclusion
# check runs against the *request* path, which strip_extensions has already
# stripped: the pattern "PLAN.md" never matches a request for "/PLAN".
#   - gomddoc serve: /PLAN returns 200 with the full rendered content.
#   - gomddoc build: no content is written, but a 260-byte meta-refresh stub
#     lands at public/PLAN.md, disclosing the filename. This is what `make
#     prune` deletes.
# Directory patterns ("docs/") hold in serve mode — they carry no extension, so
# they still match the stripped path — but leak stubs in build mode.
#
# Fixed upstream by c80981e, unmerged and unreleased as of v0.1.1. See
# TICKET-exclude-confidentiality.md in the gomddoc checkout. Once a release
# carries it, bump GOMDDOC_VERSION in .github/workflows/deploy.yml; keep the
# prune step regardless, as defence in depth.
#
# The real defence is that private material is not in this repository at all:
# see .gitignore.
exclude:
  - "CLAUDE.md"
  - "Makefile"
  - "DESIGN_PROMPT.md"
  - "PLAN.md"
  - "docs/"

theme:
  name: le-bureau

color_chips: false
