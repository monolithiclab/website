meta:
  title: "Monolithic Lab"
  description: "CTO à temps partagé et CTO de transition pour PME et scale-ups. Plus de 25 ans d’expérience en direction technique, systèmes et opérations."
  domain: "monolithiclab.fr"

language: fr

# WARNING: up to gomddoc v0.1.1, `exclude` was NOT a confidentiality boundary.
#
# It suppressed page rendering, search, navigation and metadata, so every
# visible signal said the file was excluded. But `resolve.Build` was never given
# this list, so it still minted a clean URL for each entry, and the exclusion
# check ran against the *request* path, which strip_extensions had already
# stripped: the pattern "PLAN.md" never matched a request for "/PLAN".
#   - gomddoc serve: /PLAN returned 200 with the full rendered content.
#   - gomddoc build: no content was written, but a 260-byte meta-refresh stub
#     landed at public/PLAN.md, disclosing the filename.
#
# Fixed upstream by c80981e, first released in v0.1.2 — the version CI pins
# (GOMDDOC_VERSION in .github/workflows/deploy.yml). `make prune` still deletes
# and refuses private files in public/, as defence in depth.
#
# The real defence is that private material is not in this repository at all:
# see .gitignore.
#
# PLAN.md, DESIGN_PROMPT.md and docs/ are gitignored and absent from any
# checkout, so they are not listed here (gomddoc doctor flags patterns that
# match nothing); the Makefile's prune step still checks for them.
exclude:
  - "CLAUDE.md"
  - "Makefile"
  - "common.mk"

theme:
  name: basalt
  vars:
    # Not a CSS custom property despite living under theme.vars — gomddoc
    # v0.1.2's MetaConfig has no field for arbitrary IDs, and theme.vars is the
    # only extensible map exposed to templates. Safe here because head.html.tmpl
    # never calls the CSS-generating function that would otherwise turn every
    # theme.vars key into a --theme-* custom property.
    gtm_id: "GTM-T26W68XM"
  features:
    color_chips: false
